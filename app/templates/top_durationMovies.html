{% extends "layout.html" %} {% block content %}
<div class="zone-header">
  <h1>Filme Mais Longo Por Género</h1>
  <p>O filme de maior duração em cada género.</p>
</div>

<div class="table-container">
  <table class="styled-table">
    <thead>
      <tr>
        <th class="col-genre">Género</th>
        <th class="col-title">Filme</th>
        <th class="col-duration">Duração</th>
      </tr>
    </thead>
    <tbody>
      {% for show in topDurationMovies %}
      <tr>
        <td class="col-genre"><a href="/genre/{{ show.genreID }}/">{{ show.genrename }}</a></td>
        <td class="col-title"><a href="/show/{{ show.showID }}/">{{ show.movietitle }}</a></td>
        <td class="col-duration">{{ show.duration_value }} {{ show.duration_unit }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<style>
  .table-container {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-secondary);
    margin-top: 2rem;
  }

  .styled-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
    text-align: left;
  }

  .styled-table th,
  .styled-table td {
    padding: 1rem 1.5rem;
  }

  .styled-table thead tr {
    background-color: #2c3039;
    color: var(--text-primary);
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    border-bottom: 2px solid var(--border-color);
  }

  .styled-table tbody tr {
    border-bottom: 1px solid var(--border-color);
    transition: background-color 0.2s ease;
  }

  .styled-table tbody tr:last-of-type {
    border-bottom: none;
  }

  .styled-table tbody tr:hover {
    background-color: rgba(255, 255, 255, 0.03);
  }

  .col-title a, .col-genre a {
        color: inherit;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.2s;
    }

  .col-title a:hover, .col-genre a:hover{
        color: #61dafb;
        text-decoration: underline;
        cursor: pointer;
    }
</style>

{% endblock %}
