{% extends "layout.html" %}

{% block content %}
<div class="zone-header">
  <h1>Crescimento Acumulado</h1>
  <p>Evolução do número total de títulos no catálogo ao longo do tempo.</p>
</div>

<div class="table-container">
  <table class="styled-table">
    <thead>
      <tr>
        <th class="col-month">Mês</th>
        <th class="col-added">Adicionados no Mês</th>
        <th class="col-total">Total Acumulado</th>
      </tr>
    </thead>
    <tbody>
      {% for row in growth %}
      <tr>
        <td class="col-month">{{ row.month }}</td>
        <td class="col-added">+{{ row.monthly_added }}</td>
        <td class="col-total">{{ row.cumulative_total }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<style>
  .table-container {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-secondary);
    margin-top: 2rem;
  }

  .styled-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
    text-align: left;
  }

  .styled-table th,
  .styled-table td {
    padding: 1rem 1.5rem;
  }

  .styled-table thead tr {
    background-color: #2c3039;
    color: var(--text-primary);
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    border-bottom: 2px solid var(--border-color);
  }

  .styled-table tbody tr {
    border-bottom: 1px solid var(--border-color);
    transition: background-color 0.2s ease;
  }

  .styled-table tbody tr:last-of-type {
    border-bottom: none;
  }

  .styled-table tbody tr:hover {
    background-color: rgba(255, 255, 255, 0.03);
  }

  .col-month {
    font-weight: 500;
    color: var(--text-primary);
  }
  
  .col-added {
    color: #61dafb; 
  }

  .col-total {
    font-weight: bold;
    color: var(--text-primary);
  }
</style>

{% endblock %}
