{% extends "layout.html" %}

{% block content %}
<div class="zone-header">
  <h1>Catálogo</h1>
  <p>Lista dos filmes e séries registados na base de dados.</p>
</div>

<div class="table-container">
  <table class="styled-table">
    <thead>
      <tr>
        <th class="col-person" href="">Ator/Atriz</th>
        <th class="col-movies">Número de Shows</th>
      </tr>
    </thead>
    <tbody>
      {% for a in topActors %}
      <tr>
        <td class="col-person"> <a href="/person/{{ a.personID }}/">{{ a.name }}</a></td>
        <td class="col-movies">{{ a.NumberOfMovies }}</a> </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<style>

  .table-container {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-secondary);
  }

  .styled-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
    text-align: left;
  }

  .styled-table th,
  .styled-table td {
    padding: 1rem 1.5rem;
  }

  .styled-table thead tr {
    background-color: #2c3039;
    /* Slightly lighter than bg-secondary */
    color: var(--text-primary);
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    border-bottom: 2px solid var(--border-color);
  }

  .styled-table tbody tr {
    border-bottom: 1px solid var(--border-color);
    transition: background-color 0.2s ease;
  }

  .styled-table tbody tr:last-of-type {
    border-bottom: none;
  }

  .styled-table tbody tr:hover {
    background-color: rgba(255, 255, 255, 0.03);
  }

  .col-movies {
    width: 40%;
    text-align: right;
    font-weight: 500;
    color: var(--text-primary);
  }

  .col-person {
    font-weight: 500;
    color: var(--text-primary);
  }

  .col-person a, .col-type a, .col-genre a , .col-rdate a{
        color: inherit;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.2s;
    }

  .col-person a:hover, .col-type a:hover, .col-genre a:hover, .col-rdate a:hover {
        color: #61dafb;
        text-decoration: underline;
        cursor: pointer;
    }
</style>

{% endblock %}
